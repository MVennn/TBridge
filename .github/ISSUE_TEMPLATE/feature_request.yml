name: 功能建议
description: 想加新的 op、节点字段、回退策略或 CLI 子命令
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先翻翻已有 Issue；建议只涉及「进程内读 View / 一行 JSON 协议 / PC 端客户端」，不涉及自动刷量或账号数据。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 建议前确认
      options:
        - label: 我已知悉本模块是本地调试通道，访问控制由使用者负责。
          required: true
        - label: 我的建议不涉及采集账号数据、不绕过鉴权、不面向不受信网络。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 什么场景不顺手
      description: 先说场景再说想法——哪个 op、现在返回什么、想变成什么。
      placeholder: |
        例：
        tree 只给 bounds 和 text，做无障碍断言时还得再发一次 find；
        希望能让 tree 顺带带 clickable 标志。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的响应形态（可选）
      description: 建议的 op / 字段 / 响应 JSON，别只写「更方便」。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
    validations:
      required: false
